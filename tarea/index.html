<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Películas por Ver</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 15px; }
    form { display: flex; gap: 8px; margin-bottom: 15px; }
    input, button { padding: 8px; font-size: 14px; }
    li { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; background: #f4f4f4; padding: 8px 12px; border-radius: 4px; }
    .btn-borrar { background: #e53935; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Lista de Películas por Ver</h1>

  <form id="formPelicula">
    <input type="text" id="tituloPelicula" placeholder="Nombre de la película" required>
    <input type="text" id="generoPelicula" placeholder="Género (ej. Acción)" required>
    <button type="submit">Agregar</button>
  </form>

  <ul id="listaPeliculas"></ul>

  <script src="app.js"></script>
</body>
</html>
